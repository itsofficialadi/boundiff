name: Validate skill pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate metadata and links
        run: python3 scripts/check_pack.py
      - name: Test optional installer
        run: python3 -m unittest discover -s tests -v
